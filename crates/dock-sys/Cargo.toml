[package]
name = "dock-sys"
version = "0.1.0"
edition = "2021"
description = "Cam Dock için Windows sistem katmanı (taskbar, AppBar, acrylic, pencereler, medya)"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.17"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
]
