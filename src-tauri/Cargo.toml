[package]
name = "cam-dock"
version = "0.9.0"
authors = ["Ali Apaydın <apaydin.a@gmail.com>"]
description = "Windows 11 için cam dock (klasik taskbar yerine)"
edition = "2021"
default-run = "cam-dock"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
dock-sys = { path = "../crates/dock-sys" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
