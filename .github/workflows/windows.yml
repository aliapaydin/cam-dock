name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: cam-dock-windows
          path: |
            src-tauri/target/release/cam-dock.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Otomatik güncelleme: kurulum dosyasını açık "cam-dock-releases"
      # deposunda yayınla (kod gizli kalır). RELEASES_TOKEN gizli anahtarı
      # yoksa bu adım atlanır. Aynı sürüm zaten yayınlandıysa dokunmaz;
      # yeni sürüm için tauri.conf.json'daki version artırılmalı.
      - name: Sürümü yayınla
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: aliapaydin/cam-dock-releases
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not $env:GH_TOKEN) { Write-Host "RELEASES_TOKEN yok, yayın atlandı"; exit 0 }
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $repoInfo = gh api "repos/$env:REPO" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Yayın deposuna erişilemedi::$env:REPO okunamadı. Anahtarın bu depoya erişimi var mı? $($repoInfo -join ' ')"
            exit 1
          }
          # Boş depoda etiket oluşturulamaz: ilk kez README ekle.
          $readme = "IyBDYW0gRG9jayBzw7xyw7xtbGVyaQoKV2luZG93cyAxMSBpw6dpbiBjYW0gZG9jayBrdXJ1bHVtIGRvc3lhbGFyxLEuIEVuIHllbmkgc8O8csO8bSBpw6dpbiBSZWxlYXNlcyBiw7Zsw7xtw7xuZSBiYWsuCg=="
          gh api "repos/$env:REPO/contents/README.md" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh api -X PUT "repos/$env:REPO/contents/README.md" -f message="İlk commit" -f content=$readme *> $null
          }
          # Önceki yarım kalmış (taslak ya da dosyasız) sürümü temizle.
          $existing = gh release view $tag --repo $env:REPO --json isDraft,assets 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if (-not $existing.isDraft -and ($existing.assets | Where-Object { $_.name -like '*-setup.exe' })) {
              Write-Host "$tag zaten yayınlanmış"; exit 0
            }
            gh release delete $tag --repo $env:REPO --yes --cleanup-tag *> $null
          }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Host "::error title=Kurulum dosyası yok::NSIS çıktısı bulunamadı"; exit 1 }
          $notes = (git log -1 --pretty=%B) -join "`n"
          $notes = ($notes -split "`n" | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }) -join "`n"
          $out = gh release create $tag $setup.FullName --repo $env:REPO --title "Cam Dock $ver" --notes $notes 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Sürüm oluşturulamadı::$($out -join ' ')"
            exit 1
          }
          Write-Host "::notice title=Yayınlandı::$tag → $env:REPO"
