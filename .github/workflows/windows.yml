name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Telefon uygulaması (Android, WebView kabuğu). Derlenemezse Windows sürümü
  # yine yayınlanır; APK o sürümde eksik kalır.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: APK derle
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/camdock.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/camdock.jks"
          else
            echo "::warning title=İmza anahtarı yok::APK hata ayıklama imzasıyla derlendi"
          fi
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -20 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=APK derlenemedi::$msg"
            exit $status
          fi
          cp android/app/build/outputs/apk/release/app-release.apk CamDock-Telefon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: camdock-phone
          path: CamDock-Telefon.apk

  build:
    needs: android
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: camdock-phone
          path: phone-apk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      # NSIS araçları GitHub'dan indiriliyor; bağlantı hatalarına karşı önbellek ve yeniden deneme
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-v1

      - name: Derle
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Derleme denemesi $i başarısız; 30 sn sonra yeniden denenecek"
            Start-Sleep -Seconds 30
          }
          exit 1

      # Microsoft Store paketi (MSIX). Aynı exe; Store sürümü olduğunu çalışırken
      # kendisi anlar (kendi güncelleyicisi kapanır, Windows ile başlat paketten).
      # Partner Center imzalar; buradaki paket imzasızdır.
      - name: Store paketi (MSIX)
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version + ".0"
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $mk = Join-Path $kit.FullName "makeappx.exe"
          $mp = Join-Path $kit.FullName "makepri.exe"
          $d = "msix"
          New-Item -ItemType Directory $d -Force | Out-Null
          Copy-Item src-tauri/target/release/cam-dock.exe $d
          Copy-Item store/Assets "$d/Assets" -Recurse
          (Get-Content store/AppxManifest.xml -Raw).Replace("__VERSION__", $ver) | Set-Content "$d/AppxManifest.xml" -Encoding utf8
          & $mp new /pr $d /cf store/priconfig.xml /of "$d/resources.pri" /mn "$d/AppxManifest.xml" /o
          if ($LASTEXITCODE) { Write-Host "::error title=MSIX::makepri başarısız"; exit 1 }
          & $mk pack /d $d /p "CamDock_${ver}_x64.msix" /o
          if ($LASTEXITCODE) { Write-Host "::error title=MSIX::makeappx başarısız"; exit 1 }
          Write-Host "::notice title=Store paketi::CamDock_${ver}_x64.msix hazır (Artifacts → CamDock-Store)"

      - uses: actions/upload-artifact@v4
        with:
          name: CamDock-Store
          path: CamDock_*_x64.msix

      - uses: actions/upload-artifact@v4
        with:
          name: cam-dock-windows
          path: |
            src-tauri/target/release/cam-dock.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # Otomatik güncelleme: kurulum dosyasını açık "cam-dock-releases"
      # deposunda yayınla (kod gizli kalır). RELEASES_TOKEN gizli anahtarı
      # yoksa bu adım atlanır. Aynı sürüm zaten yayınlandıysa dokunmaz;
      # yeni sürüm için tauri.conf.json'daki version artırılmalı.
      - name: Sürümü yayınla
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: aliapaydin/cam-dock-releases
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not $env:GH_TOKEN) { Write-Host "RELEASES_TOKEN yok, yayın atlandı"; exit 0 }
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $repoInfo = gh api "repos/$env:REPO" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Yayın deposuna erişilemedi::$env:REPO okunamadı. Anahtarın bu depoya erişimi var mı? $($repoInfo -join ' ')"
            exit 1
          }
          # Boş depoda etiket oluşturulamaz: ilk kez README ekle.
          $readme = "IyBDYW0gRG9jayBzw7xyw7xtbGVyaQoKV2luZG93cyAxMSBpw6dpbiBjYW0gZG9jayBrdXJ1bHVtIGRvc3lhbGFyxLEuIEVuIHllbmkgc8O8csO8bSBpw6dpbiBSZWxlYXNlcyBiw7Zsw7xtw7xuZSBiYWsuCg=="
          gh api "repos/$env:REPO/contents/README.md" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh api -X PUT "repos/$env:REPO/contents/README.md" -f message="İlk commit" -f content=$readme *> $null
          }
          # Önceki yarım kalmış (taslak ya da dosyasız) sürümü temizle.
          $existing = gh release view $tag --repo $env:REPO --json isDraft,assets 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if (-not $existing.isDraft -and ($existing.assets | Where-Object { $_.name -like '*-setup.exe' })) {
              Write-Host "$tag zaten yayınlanmış"; exit 0
            }
            gh release delete $tag --repo $env:REPO --yes --cleanup-tag *> $null
          }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Host "::error title=Kurulum dosyası yok::NSIS çıktısı bulunamadı"; exit 1 }
          $notes = (git log -1 --pretty=%B) -join "`n"
          $notes = ($notes -split "`n" | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }) -join "`n"
          $files = @($setup.FullName)
          $apk = Get-ChildItem phone-apk/CamDock-Telefon.apk -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($apk) { $files += $apk.FullName } else { Write-Host "::warning title=APK yok::Telefon uygulaması bu sürümde yok" }
          $out = gh release create $tag @files --repo $env:REPO --title "Cam Dock $ver" --notes $notes 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Sürüm oluşturulamadı::$($out -join ' ')"
            exit 1
          }
          Write-Host "::notice title=Yayınlandı::$tag → $env:REPO"
